<!DOCTYPE html>
<html><head><title>Генератор иконок</title></head>
<body style="background:#111;color:#fff;font-family:Arial;text-align:center;padding:40px">
<h2>Генератор иконок для Стрелок</h2>
<p>Нажмите на иконку правой кнопкой → Сохранить как</p>
<canvas id="c192" width="192" height="192" style="border:1px solid #333;margin:10px"></canvas>
<canvas id="c512" width="512" height="512" style="border:1px solid #333;margin:10px"></canvas>
<br>
<a id="dl192" download="icon-192.png" style="color:#4af;margin:10px">Скачать 192x192</a>
<a id="dl512" download="icon-512.png" style="color:#4af;margin:10px">Скачать 512x512</a>
<script>
function drawIcon(canvas) {
    const s = canvas.width;
    const ctx = canvas.getContext('2d');
    // bg
    const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s*0.6);
    g.addColorStop(0, '#1a1030');
    g.addColorStop(1, '#050510');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, s, s);
    // grid
    ctx.strokeStyle = 'rgba(100,60,180,0.15)';
    ctx.lineWidth = s/100;
    for (let i = 0; i < s; i += s/8) {
        ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,s); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(s,i); ctx.stroke();
    }
    // bullet trail
    ctx.shadowBlur = s*0.08;
    ctx.shadowColor = '#bb66ff';
    ctx.strokeStyle = '#9944dd';
    ctx.lineWidth = s*0.03;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(s*0.15, s*0.85);
    ctx.lineTo(s*0.35, s*0.45);
    ctx.lineTo(s*0.65, s*0.55);
    ctx.lineTo(s*0.80, s*0.20);
    ctx.stroke();
    // bounce points
    const pts = [[0.35,0.45],[0.65,0.55]];
    for (const p of pts) {
        ctx.fillStyle = '#bb66ff';
        ctx.beginPath();
        ctx.arc(s*p[0], s*p[1], s*0.025, 0, Math.PI*2);
        ctx.fill();
    }
    // bullet
    ctx.shadowBlur = s*0.1;
    ctx.shadowColor = '#dd88ff';
    ctx.fillStyle = '#cc66ff';
    ctx.beginPath();
    ctx.arc(s*0.80, s*0.20, s*0.05, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s*0.80, s*0.20, s*0.025, 0, Math.PI*2);
    ctx.fill();
    // target
    ctx.shadowBlur = s*0.06;
    ctx.shadowColor = '#ff4466';
    ctx.strokeStyle = '#ff4466';
    ctx.lineWidth = s*0.015;
    ctx.beginPath();
    ctx.arc(s*0.80, s*0.20, s*0.10, 0, Math.PI*2);
    ctx.stroke();
    ctx.shadowBlur = 0;
    // text
    ctx.shadowBlur = s*0.04;
    ctx.shadowColor = '#00aaff';
    ctx.fillStyle = '#00ddff';
    ctx.font = `bold ${s*0.14}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('С', s*0.5, s*0.82);
    ctx.shadowBlur = 0;
}
drawIcon(document.getElementById('c192'));
drawIcon(document.getElementById('c512'));
document.getElementById('dl192').href = document.getElementById('c192').toDataURL();
document.getElementById('dl512').href = document.getElementById('c512').toDataURL();
</script>
</body></html>
